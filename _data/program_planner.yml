# Program planner shown on the Undergraduate Physics page.
#
# To edit: change the course codes below. Each course needs a `code` and a `type`
# (core, major, directed or elective). Leave out `code` for a free elective slot,
# which students can fill in themselves on the page.
#   option: true  marks a course that is one of several options (shown with *)
#   alt: STAT1070 shows an alternative course ("or STAT1070")
#   name: "Fourier Analysis" is the course title, shown under the code
# Course codes link to the Handbook for `handbook_year`.

title: "Bachelor of Science (Physics)"
handbook_year: 2027

categories:
  - key: core
    label: "Bachelor of Science core"
    note: "Everyone in the Bachelor of Science completes SCIE1002, STAT1070 or STAT1300, MATH1110, INFT1004 and SCIE3002."
  - key: major
    label: "Physics major"
    note: "PHYS1210, PHYS1220, MATH1110, MATH1120, PHYS2101, PHYS2203, PHYS2204, MATH2310, PHYS3101, PHYS3102 and PHYS3203."
  - key: directed
    label: "Directed"
    note: "10 units from MATH2242, MATH3810 or PHYS2102. The options marked * are suggestions; you only need one."
  - key: elective
    label: "Electives"
    note: "Suggested electives: PHYS2100 (Introduction to Astronomy) and MATH3205 (Fourier Analysis). Type your own choices into the empty elective boxes to plan your degree."

years:
  - name: "Year 1"
    semesters:
      - - { code: SCIE1002, type: core, name: "Multidisciplinary Laboratories" }
        - { code: PHYS1210, type: major, name: "Advanced Physics I" }
        - { code: MATH1110, type: major, name: "Mathematics for Engineering, Science and Technology 1" }
        - { type: elective }
      - - { code: STAT1300, type: core, alt: STAT1070, name: "Fundamentals of Statistics" }
        - { code: PHYS1220, type: major, name: "Advanced Physics II" }
        - { code: MATH1120, type: major, name: "Mathematics for Engineering, Science and Technology 2" }
        - { type: elective }

  - name: "Year 2"
    semesters:
      - - { code: INFT1004, type: core, name: "Introduction to Programming" }
        - { code: MATH2310, type: major, name: "Calculus of Science and Engineering" }
        - { code: PHYS2101, type: major, name: "Quantum Science" }
        - { code: PHYS2102, type: directed, option: true, name: "Particles and Space" }
      - - { code: PHYS2203, type: major, name: "Advanced Mechanics" }
        - { code: PHYS2204, type: major, name: "Electromagnetism" }
        - { type: elective }
        - { code: MATH2242, type: directed, option: true, name: "Complex Analysis" }

  - name: "Year 3"
    semesters:
      - - { code: PHYS3101, type: major, name: "Statistical Mechanics" }
        - { code: PHYS3102, type: major, name: "Materials Physics" }
        - { code: MATH2242, type: directed, option: true, name: "Complex Analysis" }
        - { type: elective }
      - - { code: PHYS3203, type: major, name: "Atomic and Nuclear Physics" }
        - { code: PHYS3204, type: elective, option: true, name: "Nanoscience" }
        - { code: SCIE3002, type: core, name: "WIL for the Sciences" }
        - { type: elective }
