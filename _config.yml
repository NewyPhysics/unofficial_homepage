title: "Unofficial University of Newcastle Physics"
description: "An unofficial community website for physics research, teaching and students at the University of Newcastle."
url: "https://newyphysics.github.io"
baseurl: "/unofficial_homepage"
markdown: kramdown


collections:
  people:
    output: true
    permalink: people/:path/
  research:
    output: true
    permalink: research/:path/
  teaching:
    output: true
    permalink: teaching/:path/
  news:
    output: true
    permalink: news/:path/
  projects:
    output: true
    permalink: projects/:path/

defaults:
  # Base default for regular pages (Missing in your original file)
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  # Your collection defaults
  - scope:
      path: ""
      type: "people"
    values:
      layout: "person"
  - scope:
      path: ""
      type: "research"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "news"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"
      
